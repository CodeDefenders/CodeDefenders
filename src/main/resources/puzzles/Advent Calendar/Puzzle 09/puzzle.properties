title=Day 9
description=Now all gifts are produced and packaged. Santa still needs to deliver them. Fortunately, Santa's new sleigh has an autopilot, so he doesn't need to remember the whole route. \
He just needs to feed in a map with all of the houses, his current position, obstacles and frozen regions. The sleigh cannot brake on ice, so if he is moving on ice, he will only \
come to a stop once he reaches normal ground, an obstacle or a house. Each house can only be delivered to once. Every map needs exactly one starting position. <br>\n\
Something doesn't seem to work quite as expected, though. <br>\n\
Write a test which kills the remaining mutant
type=DEFENDER
gameLevel=EASY

